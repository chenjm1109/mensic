[package]
name = "mensic"
version = "0.1.0"
description = "mensic — 本地数据可视化编辑器"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mensic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# 剪贴板：走原生剪贴板，**不要让 WebView 自己弹权限气泡**
# （`navigator.clipboard.readText` 会弹一个浏览器样式的「允许读取剪贴板？」提示，在桌面应用里非常出戏）
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 安卓：与 Kotlin/Chaquopy 之间的 JNI 通道
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
