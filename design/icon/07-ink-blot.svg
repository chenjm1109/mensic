<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="墨滴洇在方格纸上">
  <defs>
    <clipPath id="sq7"><rect width="512" height="512" rx="114"/></clipPath>
    <pattern id="pg7" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#E3EAF3" stroke-width="3"/>
    </pattern>
  </defs>
  <g clip-path="url(#sq7)">
    <rect width="512" height="512" fill="#FEFAF9"/>
    <rect width="512" height="512" fill="url(#pg7)"/>

    <!-- 晕开的一圈（同一形状放大、极低透明度） -->
    <g fill="#E05F79" opacity="0.12" transform="translate(256 250) scale(1.14) translate(-256 -250)">
      <circle cx="256" cy="250" r="112"/>
      <circle cx="178" cy="176" r="40"/>
      <circle cx="338" cy="198" r="34"/>
      <circle cx="326" cy="320" r="38"/>
      <circle cx="190" cy="326" r="30"/>
      <circle cx="256" cy="132" r="26"/>
    </g>

    <!-- 墨滴本体：一个圆 + 五个不等大的凸起，拼出不规则边缘（别再加大尾巴，会像聊天气泡） -->
    <g fill="#E05F79">
      <circle cx="256" cy="250" r="112"/>
      <circle cx="178" cy="176" r="40"/>
      <circle cx="338" cy="198" r="34"/>
      <circle cx="326" cy="320" r="38"/>
      <circle cx="190" cy="326" r="30"/>
      <circle cx="256" cy="132" r="26"/>
    </g>

    <!-- 飞溅的小点 -->
    <g fill="#E05F79">
      <circle cx="392" cy="140" r="15"/>
      <circle cx="414" cy="214" r="9" opacity="0.7"/>
      <circle cx="128" cy="358" r="12" opacity="0.8"/>
    </g>
  </g>
</svg>
