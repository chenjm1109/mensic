<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 安卓自适应图标前景层：108dp 画布里只有中间 72dp 可见，圆环按 72dp 的 63% 放
       （= 108dp 画布的 42%），这样进桌面后和 Windows 图标的留白比例完全一致 -->
  <defs>
    <mask id="gapfg" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g stroke="#000" stroke-width="16" stroke-linecap="butt">
        <line x1="316" y1="256" x2="426" y2="256"/>
        <line x1="286" y1="308" x2="341" y2="403"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <g mask="url(#gapfg)">
      <circle cx="256" cy="256" r="114" fill="none" stroke="#E05F79" stroke-width="72"/>
      <path d="M406 256 A150 150 0 0 1 331 385.9 L295 323.5 A78 78 0 0 0 334 256 Z" fill="#F3AEB9"/>
    </g>
  </g>
</svg>
