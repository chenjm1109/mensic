<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="朱印">
  <defs>
    <clipPath id="sq5"><rect width="512" height="512" rx="114"/></clipPath>
    <!-- 印边被啃掉的小缺口 -->
    <mask id="dent5">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="2" cy="318" r="16" fill="#000"/>
      <circle cx="6" cy="182" r="10" fill="#000"/>
      <circle cx="508" cy="398" r="13" fill="#000"/>
    </mask>
  </defs>
  <g clip-path="url(#sq5)">
    <g mask="url(#dent5)">
      <rect width="512" height="512" fill="#E05F79"/>
    </g>

    <!-- 白色负形的图表：柱子与基线，留缝，避免糊成一坨 -->
    <g fill="#FDFBF7" transform="translate(256 256) scale(1.3) translate(-256 -281)">
      <rect x="164" y="292" width="46" height="64" rx="7"/>
      <rect x="232" y="242" width="46" height="114" rx="7"/>
      <rect x="300" y="186" width="46" height="170" rx="7"/>
      <rect x="150" y="364" width="212" height="12" rx="6"/>
    </g>
  </g>
</svg>
