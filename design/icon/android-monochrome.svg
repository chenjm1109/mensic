<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 安卓 13+ 主题图标（monochrome）：只有剪影，系统按壁纸取色 -->
  <defs>
    <mask id="gapmono" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g stroke="#000" stroke-width="16" stroke-linecap="butt">
        <line x1="316" y1="256" x2="426" y2="256"/>
        <line x1="286" y1="308" x2="341" y2="403"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)" mask="url(#gapmono)">
    <circle cx="256" cy="256" r="114" fill="none" stroke="#FFFFFF" stroke-width="72"/>
    <path d="M406 256 A150 150 0 0 1 331 385.9 L295 323.5 A78 78 0 0 0 334 256 Z" fill="#FFFFFF"/>
  </g>
</svg>
