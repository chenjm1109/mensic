id: scatter-ellipse
version: 2
status: published
title: 带分布椭圆散点图
category: scatter
tags: [散点图, 分布椭圆, PCA]
summary: 在分组散点上为每组叠加 2σ 协方差椭圆，直观展示各组中心、离散与相关性。
difficulty: intermediate
default_library: matplotlib
order: 50
theme: rose
data:
  source: data/ellipse.csv
  schema:
    columns:
      - { name: 主成分1, role: x, type: quantitative, required: true }
      - { name: 主成分2, role: y, type: quantitative, required: true }
      - { name: 类别, role: series, type: categorical, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: rect
  title: { text: 带分布椭圆散点图, loc: left }
  xlabel: 主成分1
  ylabel: 主成分2
  ticks:
    x_major: 0.5
    x_minor: 0.1
    y_major: 0.5
    y_minor: 0.1
  legend: { loc: upper center, ncols: 3 }
params:
  - { key: point_size, type: number, default: 100, min: 10, max: 400 }
  - { key: alpha, type: number, default: 0.5, min: 0.1, max: 1 }
  - { key: n_std, type: number, default: 2.0, min: 0.5, max: 4 }
  - { key: show_projection, type: bool, default: true }
elements:
  - { key: point, label: 数据点, group_by: series, size: point_size, opacity: alpha }
  - { key: ellipse, label: 分布椭圆, group_by: series }
implementations:
  - { library: matplotlib }
  - { library: plotly }
