id: bubble-strip
version: 2
status: published
title: 单轴分组气泡图
category: scatter
tags: [散点图, 气泡图, 分组, 单轴]
summary: 把五个分组放到同一根分类轴上，用气泡大小表示数值，形成横向排列的分组条带。
difficulty: intermediate
default_library: matplotlib
order: 100
theme: rose
data:
  source: data/strip.csv
  schema:
    columns:
      - { name: X, role: x, type: quantitative, required: true }
      - { name: 分组, role: y, type: categorical, required: true }
      - { name: 大小, role: size, type: quantitative, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: rect
  title: { text: 单轴分组气泡图, loc: center }
  xlabel: X轴
  ticks: { x_major: 1, x_minor: 0.2 }
  legend: { loc: upper center, ncols: 5 }
params:
  - { key: point_alpha, type: number, default: 0.5, min: 0, max: 1 }
  - { key: size_scale, type: number, default: 1.0, min: 0.2, max: 3 }
elements:
  - { key: point, label: 气泡, group_by: category, group_role: y, size: size_scale, opacity: point_alpha }
implementations:
  - { library: matplotlib }
  - { library: plotly }
  - { library: altair }
