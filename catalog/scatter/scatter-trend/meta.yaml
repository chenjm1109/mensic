id: scatter-trend
version: 2
status: draft
title: 带趋势线散点图
category: scatter
tags: [散点图, 趋势线, 拟合]
summary: 对多组数据分别叠加线性、二次多项式与指数拟合曲线，比较不同趋势形态。
difficulty: intermediate
default_library: matplotlib
order: 30
theme: rose
data:
  source: data/trend.csv
  schema:
    columns:
      - { name: X轴, role: x, type: quantitative, required: true }
      - { name: Y轴, role: y, type: quantitative, required: true }
      - { name: 组别, role: series, type: categorical, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: rect
  title: { text: 带趋势线散点图, loc: left }
  xlabel: X轴
  ylabel: Y轴
  ticks:
    x_major: 1
    x_minor: 0.1
    y_major: 10
    y_minor: 2
  legend: { loc: upper center, ncols: 3 }
params:
  - { key: point_size, type: number, default: 100, min: 10, max: 400 }
  - { key: alpha, type: number, default: 0.5, min: 0.1, max: 1 }
  - { key: show_projection, type: bool, default: true }
elements:
  - { key: point, label: 数据点, group_by: series, size: point_size, opacity: alpha }
  - { key: line, label: 趋势线, group_by: series }
implementations:
  - { library: matplotlib }
  - { library: plotly }
  - { library: altair }
