id: bubble-basic
version: 3
status: published
title: 基本气泡图
category: scatter
tags: [散点图, 气泡图, 大小]
summary: 在散点基础上用气泡大小映射第三维数值，并在两轴边缘加地毯线展示一维分布。
difficulty: beginner
default_library: matplotlib
order: 80
theme: rose
data:
  source: data/bubbles.csv
  schema:
    columns:
      - { name: X, role: x, type: quantitative, required: true }
      - { name: Y, role: y, type: quantitative, required: true }
      - { name: 大小, role: size, type: quantitative, required: true }
      - { name: 类型, role: series, type: categorical, optional: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: rect
  title: { text: 基本气泡图, loc: center }
  xlabel: X轴
  ylabel: Y轴
  ticks: { x_major: 5, x_minor: 1, y_major: 10, y_minor: 2 }
  legend: { loc: upper center, ncols: 2 }
params:
  - { key: point_alpha, type: number, default: 0.5, min: 0, max: 1 }
  - { key: size_scale, type: number, default: 1.0, min: 0.2, max: 3 }
elements:
  - { key: point, label: 气泡, group_by: none, size: size_scale, opacity: point_alpha }
implementations:
  - { library: matplotlib }
  - { library: plotly }
  - { library: altair }
