id: bubble-group
version: 2
status: published
title: 分组气泡图
category: scatter
tags: [散点图, 气泡图, 分组]
summary: 在气泡图上叠加三个分组，并同时用颜色区分类别、用大小映射数值，两轴边缘附地毯线。
difficulty: intermediate
default_library: matplotlib
order: 90
theme: rose
data:
  source: data/bubbles.csv
  schema:
    columns:
      - { name: X, role: x, type: quantitative, required: true }
      - { name: Y, role: y, type: quantitative, required: true }
      - { name: 大小, role: size, type: quantitative, required: true }
      - { name: 类型, role: series, type: categorical, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: rect
  title: { text: 分组气泡图, loc: center }
  xlabel: X轴
  ylabel: Y轴
  ticks: { x_major: 5, x_minor: 1, y_major: 10, y_minor: 2 }
  legend: { loc: upper left, ncols: 1 }
params:
  - { key: point_alpha, type: number, default: 0.5, min: 0, max: 1 }
  - { key: size_scale, type: number, default: 1.0, min: 0.2, max: 3 }
elements:
  - { key: point, label: 气泡, group_by: series, size: size_scale, opacity: point_alpha }
implementations:
  - { library: matplotlib }
  - { library: plotly }
  - { library: altair }
