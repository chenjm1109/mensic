id: scatter-margin
version: 2
status: published
title: 带边际分布散点图
category: scatter
tags: [散点图, 边际分布, 直方图]
summary: 主散点图配顶部与右侧的边际直方图，同时读出双变量关系与各自的一维分布。
difficulty: intermediate
default_library: matplotlib
order: 40
theme: rose
data:
  source: data/margin.csv
  schema:
    columns:
      - { name: X, role: x, type: quantitative, required: true }
      - { name: Y, role: y, type: quantitative, required: true }
      - { name: 组别, role: series, type: categorical, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: figure
  title: { text: 带边际分布散点图, loc: left }
  legend: { loc: upper center, ncols: 3 }
params:
  - { key: point_size, type: number, default: 100, min: 10, max: 400 }
  - { key: alpha, type: number, default: 0.5, min: 0.1, max: 1 }
  - { key: bin_width_x, type: number, default: 1, min: 0.1, max: 10 }
  - { key: bin_width_y, type: number, default: 2.5, min: 0.1, max: 20 }
elements:
  - { key: point, label: 数据点, group_by: series, size: point_size, opacity: alpha }
  - { key: hist, label: 边际分布, group_by: series, opacity: alpha }
implementations:
  - { library: matplotlib }
  - { library: plotly }
