id: bar-heat
version: 2
status: published
title: 热力柱状图
category: bar
tags: [柱状图, 热力, 渐变, 连续色]
summary: 用连续色映射给柱子上色，同时以颜色条标注数值与颜色的对应关系。
difficulty: intermediate
default_library: matplotlib
order: 50
theme: slate
data:
  source: data/values.csv
  schema:
    columns:
      - { name: 类别, role: x, type: ordinal, required: true }
      - { name: 数值, role: y, type: quantitative, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: rect
  title: { text: 热力柱状图, loc: left }
  xlabel: 类别
  ylabel: 数值
  limits: { y: [0, 23] }
  ticks: { x_major: 5, y_major: 5 }
  legend: false
params:
  - { key: bar_width, type: number, default: 0.8, min: 0.1, max: 1.0 }
  - { key: bar_alpha, type: number, default: 1, min: 0, max: 1 }
# 图形元素：颜色由数值连续映射，不开放颜色，只接管柱宽 / 透明度。
elements:
  - { key: bar, label: 柱子, group_by: none, size: bar_width, opacity: bar_alpha, color: false }
implementations:
  - { library: matplotlib }
  - { library: plotly }
