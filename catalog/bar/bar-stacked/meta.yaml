id: bar-stacked
version: 2
status: published
title: 堆叠柱状图
category: bar
tags: [柱状图, 堆叠, 构成]
summary: 各系列数值沿同一根柱子自下而上堆叠，展示类别内部的构成。
difficulty: beginner
default_library: matplotlib
order: 30
theme: slate
data:
  source: data/grouped.csv
  schema:
    columns:
      - { name: 类别, role: x, type: ordinal, required: true }
      - { name: 组别, role: series, type: categorical, required: true }
      - { name: 数值, role: y, type: quantitative, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: rect
  title: { text: 堆叠柱状图, loc: left }
  xlabel: 类别
  ylabel: 数值
  limits: { y: [0, 1400] }
  ticks: { y_major: 200 }
  legend: { loc: upper right, ncols: 3 }
params:
  - { key: bar_width, type: number, default: 0.7, min: 0.1, max: 0.95 }
  - { key: bar_alpha, type: number, default: 1, min: 0, max: 1 }
# 图形元素：按「组别」逐系列出块（堆叠段），与 chart.py 的配色顺序一致。
elements:
  - { key: bar, label: 柱子, group_by: series, size: bar_width, opacity: bar_alpha }
implementations:
  - { library: matplotlib }
  - { library: plotly }
  - { library: altair }
