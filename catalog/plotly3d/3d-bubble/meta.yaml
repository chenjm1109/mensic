id: 3d-bubble
version: 2
status: draft
title: 三维气泡图
category: plotly3d
tags: [三维, 气泡图, 螺旋]
summary: 沿螺旋线上升的三维气泡，气泡大小与颜色都随 Z 值变化，带半透明效果与色条。
difficulty: intermediate
default_library: plotly
order: 50
theme: rose
data:
  source: data/bubble3d.csv
  schema:
    columns:
      - { name: x, role: x, type: quantitative, required: true }
      - { name: y, role: y, type: quantitative, required: true }
      - { name: z, role: value, type: quantitative, required: true }
      - { name: size, role: size, type: quantitative, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: 3d
  title: { text: 三维气泡图, loc: left }
  xlabel: X
  ylabel: Y
params:
  - { key: opacity, type: number, default: 0.7, min: 0.1, max: 1 }
  - { key: size_scale, type: number, default: 1, min: 0.2, max: 3 }
elements:
  - { key: point, label: 气泡, group_by: none, size: size_scale, opacity: opacity, color: false }
implementations:
  - { library: plotly }
