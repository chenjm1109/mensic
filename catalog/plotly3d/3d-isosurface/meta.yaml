id: 3d-isosurface
version: 2
status: draft
title: 三维等值面图
category: plotly3d
tags: [三维, 等值面, Isosurface]
summary: 用 go.Isosurface 绘制椭球标量场的多层等值面，展示嵌套的曲面结构。
difficulty: advanced
default_library: plotly
order: 70
theme: rose
data:
  source: data/isosurface.csv
  schema:
    columns:
      - { name: x, role: x, type: quantitative, required: true }
      - { name: y, role: y, type: quantitative, required: true }
      - { name: z, role: size, type: quantitative, required: true }
      - { name: value, role: value, type: quantitative, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: 3d
  title: { text: 三维等值面图, loc: left }
  xlabel: X
  ylabel: Y
params:
  - { key: isomin, type: number, default: 10, min: 0, max: 200 }
  - { key: isomax, type: number, default: 50, min: 0, max: 400 }
  - { key: surface_count, type: integer, default: 5, min: 2, max: 12 }
  - { key: opacity, type: number, default: 1, min: 0.1, max: 1 }
elements:
  - { key: surface, label: 等值面, group_by: none, size: surface_count, opacity: opacity, color: false }
implementations:
  - { library: plotly }
