id: 3d-scatter
version: 2
status: draft
title: 三维散点图
category: plotly3d
tags: [三维, 散点图, Scatter3d]
summary: 在同一双高斯曲面上铺满三维散点，点的颜色映射到高度值并显示色条。
difficulty: intermediate
default_library: plotly
order: 30
theme: rose
data:
  source: data/scatter3d.csv
  schema:
    columns:
      - { name: x, role: x, type: quantitative, required: true }
      - { name: y, role: y, type: quantitative, required: true }
      - { name: z, role: size, type: quantitative, required: true }
      - { name: value, role: color, type: quantitative, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: 3d
  title: { text: 三维散点图, loc: left }
  xlabel: X
  ylabel: Y
params:
  - { key: marker_size, type: number, default: 4, min: 1, max: 20 }
  - { key: opacity, type: number, default: 1, min: 0.1, max: 1 }
elements:
  - { key: point, label: 散点, group_by: none, size: marker_size, opacity: opacity, color: false }
implementations:
  - { library: plotly }
