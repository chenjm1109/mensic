# 图表类别：显示名、顺序、说明
- id: scatter
  title: 散点图
  order: 10
  description: 展示变量关系、分布与聚类。
- id: area
  title: 面积图
  order: 20
  description: 展示随时间或维度的累积与构成。
- id: heatmap
  title: 热力图
  order: 30
  description: 用颜色编码矩阵或空间密度。
- id: bar
  title: 柱状图
  order: 40
  description: 类别之间的数值对比与构成。
- id: pie
  title: 饼图
  order: 50
  description: 部分与整体的占比关系。
- id: line
  title: 折线图
  order: 60
  description: 连续维度上的趋势与变化。
- id: plotly3d
  title: 三维图
  order: 70
  description: 立体空间中的曲面、散点与体数据。