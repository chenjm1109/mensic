id: heatmap-hexbin
version: 2
status: published
title: 六边形热力图
category: heatmap
tags: [热力图, 六边形, 密度]
summary: 用六边形分箱对散点做聚合平均着色，兼顾密度与数值分布。
difficulty: intermediate
default_library: matplotlib
order: 50
theme: rose
data:
  source: data/hexbin_points.csv
  schema:
    columns:
      - { name: x, role: x, type: quantitative, required: true }
      - { name: y, role: y, type: quantitative, required: true }
      - { name: 数值, role: color, type: quantitative, required: true }
presentation:
  canvas: { size: [10, 6], dpi: 150 }
  projection: rect
  title: { text: 六边形热力图, loc: left }
  xlabel: X轴
  ylabel: Y轴
  limits: { x: [-60, 90], y: [-40, 50] }
params:
  - { key: gridsize, type: integer, default: 50, min: 10, max: 100 }
  - { key: hex_alpha, type: number, default: 1, min: 0, max: 1 }
elements:
  - { key: hex, label: 六边形, group_by: none, opacity: hex_alpha, color: false }
implementations:
  - { library: matplotlib }
