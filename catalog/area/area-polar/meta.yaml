id: area-polar
version: 2
status: published
title: 极坐标堆叠面积图
category: area
tags: [面积图, 极坐标, 堆叠, 径向]
summary: 在极坐标下把多条序列沿半径堆叠，形成环形放射的堆叠面积。
difficulty: advanced
default_library: matplotlib
order: 50
theme: rose
data:
  source: data/polar.csv
  schema:
    columns:
      - { name: x, role: x, type: quantitative, required: true }
      - { name: 类别, role: series, type: categorical, required: true }
      - { name: 数值, role: y, type: quantitative, required: true }
presentation:
  canvas: { size: [8, 5], dpi: 150 }
  projection: polar
  title: { text: 极坐标堆叠面积图, loc: center }
  limits:
    x: [0, 6.2831853]
    y: [0, 11.5]
  legend: { loc: center right, ncols: 1 }
params:
  - { key: inner_radius, type: number, default: 5, min: 0, max: 8 }
  - { key: area_alpha, type: number, default: 1, min: 0.1, max: 1 }
elements:
  - { key: area, label: 面积, group_by: series, opacity: area_alpha }
implementations:
  - { library: matplotlib }
  - { library: plotly }
